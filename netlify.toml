# Netlify-Deployment der Demo-Webapp (apps/webapp).
# Monorepo: erst die Lib-Pakete bauen (Webapp loest @wardley/* ueber deren dist auf),
# dann die Vite-Webapp. pnpm wird via package.json "packageManager" (corepack) genutzt.

[build]
  # base auf Repo-Root erzwingen (ueberschreibt eine evtl. in der Netlify-UI gesetzte Base wie
  # "packages/renderer", sonst loest publish falsch auf). publish ist relativ zur base.
  base = "/"
  # Die Webapp bündelt die @wardley/*-Pakete via Vite-Alias aus dem Source (siehe vite.config.ts),
  # ist also selbst-enthaltend -> kein vorheriger Lib-Build nötig. Filter-Befehl ist cwd-unabhängig.
  command = "pnpm --filter @wardley/webapp build"
  publish = "apps/webapp/dist"

[build.environment]
  # Vite 8 benoetigt Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Single-Page-App: Map steckt im URL-Hash (#m=...), Routing ist hash-basiert.
# Der Catch-all liefert fuer beliebige Pfade index.html aus (robust gegen Deep-Links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
