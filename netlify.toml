# Netlify deployment of the demo webapp (apps/webapp).
# Monorepo: build the lib packages first (the webapp resolves @wardley/* via their dist),
# then the Vite webapp. pnpm is used via package.json "packageManager" (corepack).

[build]
  # Force base to the repo root (overrides any base possibly set in the Netlify UI such as
  # "packages/renderer", otherwise publish resolves wrong). publish is relative to base.
  base = "/"
  # The webapp bundles the @wardley/* packages from source via Vite aliases (see vite.config.ts),
  # so it is self-contained -> no prior lib build needed. The filter command is cwd-independent.
  command = "pnpm --filter @wardley/webapp build"
  publish = "apps/webapp/dist"

[build.environment]
  # Vite 8 requires Node 20.19+ / 22.12+.
  NODE_VERSION = "22"

# Single-page app: the map lives in the URL hash (#m=...), routing is hash-based.
# The catch-all serves index.html for any path (robust against deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
