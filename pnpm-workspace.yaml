packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  # vsce-sign/keytar sind nur fürs Signieren/Publishen relevant — für Build & `vsce package`
  # nicht nötig, daher keine nativen Build-Skripte zulassen.
  '@vscode/vsce-sign': false
  esbuild: true
  keytar: false

# Zentrale, fix gepinnte Versionen (Guardrail: keine ^ ~ >= *).
# Am Implementierungsdatum (2026-06) frisch gegen die npm-Registry aufgeloest.
catalog:
  # --- Runtime (renderer) ---
  diagram-js: 15.16.0
  didi: 11.0.0
  tiny-svg: 4.1.4
  min-dom: 5.3.0
  min-dash: 5.0.0
  object-refs: 0.4.0
  inherits-browser: 0.1.0
  path-intersection: 4.1.0
  clsx: 2.1.1

  # --- Domaene ---
  zod: 4.4.3

  # --- Fonts (webapp, self-hosted statt Google-Fonts-CDN; DSGVO-konform) ---
  '@fontsource-variable/fraunces': 5.2.9
  '@fontsource-variable/spline-sans': 5.2.8

  # --- Build / Tooling ---
  typescript: 6.0.3
  vite: 8.0.16
  vite-plugin-dts: 5.0.2
  tsup: 8.5.1
  esbuild: 0.28.0

  # --- VS Code Extension ---
  '@types/vscode': 1.96.0
  '@vscode/vsce': 3.9.2

  # --- Test ---
  vitest: 4.1.8
  jsdom: 29.1.1

  # --- Lint / Format ---
  eslint: 10.4.1
  '@eslint/js': 10.0.1
  typescript-eslint: 8.60.1
  eslint-config-prettier: 10.1.8
  globals: 17.6.0
  prettier: 3.8.3
  husky: 9.1.7
  lint-staged: 17.0.7
  dependency-cruiser: 17.4.3

  # --- Types ---
  '@types/node': 25.9.1

# Supply-chain cooldown: ignore versions published <3 days ago (the Exclude list below
# was inert without this base value).
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@bpmn-io/diagram-js-ui@0.2.4'
  - diagram-js@15.16.0
