version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    reviewers:
      - 'emaarco'
      - 'dominikhorn'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    reviewers:
      - 'emaarco'
      - 'dominikhorn'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
