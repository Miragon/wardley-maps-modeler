version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Don't auto-rebase open PRs on every push to the base branch — that
    # triggers a "Dependabot Updates" run after each merge to main. Keep
    # Dependabot to its configured schedule only.
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    rebase-strategy: 'disabled'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
