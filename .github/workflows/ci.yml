name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm test

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact-pinned (save-exact) so the manifest value is the resolved version — no node_modules needed.
      - id: v
        shell: bash
        run: echo "value=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

  test-browser:
    runs-on: ubuntu-latest
    needs: [lint, build, playwright-version]
    # Browsers + system deps are baked into the image, so there is no per-run install/apt cost.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run test:browser

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, build, playwright-version]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.value }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  depcruise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run depcruise

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      # The production web app: e2e runs the dev server, so only this build shows what Netlify ships.
      - run: npm run build:webapp
      - run: npm run check:build -w apps/webapp

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run format:check

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  vscode-smoke:
    uses: ./.github/workflows/vscode-smoke.yml

  # The merge gate. A job skipped because a job it needs failed reports "skipped", and a required
  # check counts a skip as passed, so this job, not the single ones, is the check for the ruleset to
  # require. Every other job of this workflow belongs in its needs.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - lint
      - test
      - playwright-version
      - test-browser
      - e2e
      - depcruise
      - build
      - format-check
      - pin-check
      - dependency-review
      - vscode-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Jobs whose own if: leaves them out of this event: dependency-review compares the
          # dependencies of a pull request with its base, which no other event has.
          SKIPPED_BY_DESIGN: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          set -euo pipefail
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          if [[ -z "$results" ]]; then
            echo "::error::ci-ok needs no job"
            exit 1
          fi
          failed=0
          while read -r job result; do
            if [[ "$result" == success ]]; then
              echo "$job: success"
            elif [[ "$result" == skipped && " $SKIPPED_BY_DESIGN " == *" $job "* ]]; then
              echo "$job: skipped by design on this event"
            else
              echo "::error::$job: $result"
              failed=1
            fi
          done <<< "$results"
          exit "$failed"
