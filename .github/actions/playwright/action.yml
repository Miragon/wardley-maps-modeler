name: Playwright browsers
description: Install the Chromium build Playwright needs, restored from cache keyed on the pinned Playwright version.

runs:
  using: composite
  steps:
    # Exact-pinned (save-exact) so the manifest value is the resolved version — no node_modules needed to read it.
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: echo "value=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.value }}

    # On a cache hit the browser download is skipped; --with-deps still runs apt (uncached, fast).
    - name: Install Chromium
      shell: bash
      run: npx playwright install --with-deps chromium
