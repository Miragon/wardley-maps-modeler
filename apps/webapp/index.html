<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Wardley Mapping</title>
    <!-- Fonts werden self-hosted via @fontsource (in src/main.ts importiert) geladen –
         kein externer Google-Fonts-CDN (offline-fähig & DSGVO-konform). -->
  </head>
  <body>
    <div id="app">
      <!-- Canvas füllt die volle Fläche; die Chrome floatet darüber (Excalidraw-Stil, kein Header). -->
      <div class="app-stage">
        <div id="canvas" class="app-canvas"></div>
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-card">
            <span class="empty-mark">◵</span>
            <h2>Empty canvas</h2>
            <p>Start from the example, drop a file here, or start modelling right away.</p>
            <button id="btn-example" type="button" class="primary">Show example</button>
            <span class="empty-hint"
              >Drag&nbsp;&amp;&nbsp;drop: .wmap · .owm · .json · .svg · .png</span
            >
          </div>
        </div>
      </div>

      <!-- Floating-Menü oben links -->
      <div class="app-menu" id="app-menu">
        <button
          id="btn-menu"
          type="button"
          class="icon-btn"
          aria-haspopup="true"
          aria-expanded="false"
          title="Menu"
        >
          Menu
        </button>
        <div id="menu-dropdown" class="menu-dropdown" role="menu" hidden>
          <button id="m-open" type="button" class="menu-item" role="menuitem">Open…</button>
          <button id="m-example" type="button" class="menu-item" role="menuitem">
            Show example
          </button>
          <button id="m-new" type="button" class="menu-item" role="menuitem">New / clear</button>
          <div class="menu-sep" role="separator"></div>
          <button id="m-undo" type="button" class="menu-item" role="menuitem">Undo</button>
          <button id="m-redo" type="button" class="menu-item" role="menuitem">Redo</button>
          <div class="menu-sep" role="separator"></div>
          <button id="m-json" type="button" class="menu-item" role="menuitem">Export · JSON</button>
          <button id="m-dsl" type="button" class="menu-item" role="menuitem">
            Export · OWM-DSL
          </button>
          <button id="m-svg" type="button" class="menu-item" role="menuitem">Export · SVG</button>
          <button id="m-png" type="button" class="menu-item" role="menuitem">Export · PNG</button>
          <div class="menu-sep" role="separator"></div>
          <label class="menu-field">
            <span>Map size</span>
            <select id="map-size">
              <option value="720x460">Compact</option>
              <option value="1080x680" selected>Standard</option>
              <option value="1440x900">Large</option>
              <option value="1760x720">Wide</option>
            </select>
          </label>
          <div class="menu-sep" role="separator"></div>
          <button id="m-axis" type="button" class="menu-item" role="menuitem">
            X-axis labels…
          </button>
        </div>
      </div>

      <!-- Floating-Teilen-Button oben rechts -->
      <div class="app-toolbar">
        <button id="btn-share" type="button" class="primary">Share</button>
      </div>
      <input id="file-input" type="file" accept=".wmap,.owm,.txt,.json,.svg,.png" hidden />
    </div>

    <div id="output" class="output-overlay" hidden>
      <div class="output-panel">
        <header class="output-head">
          <span id="output-title">Export</span>
          <div class="output-actions">
            <button id="output-copy" type="button" class="ghost">Copy</button>
            <button id="output-close" type="button" class="ghost">Close</button>
          </div>
        </header>
        <textarea id="output-text" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <!-- X-Achsen-Beschriftung: Preset wählen ODER einzelne Stages frei beschriften -->
    <div id="axis-overlay" class="output-overlay" hidden>
      <div class="axis-panel">
        <header class="output-head">
          <span>X-axis labels</span>
          <div class="output-actions">
            <button id="axis-close" type="button" class="ghost">Close</button>
          </div>
        </header>
        <div class="axis-body">
          <label class="axis-row">
            <span>Preset</span>
            <select id="axis-preset"></select>
          </label>
          <p class="axis-hint">
            Label sets from
            <a
              href="https://learnwardleymapping.com/landscape/"
              target="_blank"
              rel="noreferrer noopener"
              >Learn Wardley Mapping</a
            >. Pick a set, or edit each stage individually.
          </p>
          <div class="axis-stages">
            <label class="axis-stage">
              <span>Stage 1</span><input id="axis-s0" type="text" autocomplete="off" />
            </label>
            <label class="axis-stage">
              <span>Stage 2</span><input id="axis-s1" type="text" autocomplete="off" />
            </label>
            <label class="axis-stage">
              <span>Stage 3</span><input id="axis-s2" type="text" autocomplete="off" />
            </label>
            <label class="axis-stage">
              <span>Stage 4</span><input id="axis-s3" type="text" autocomplete="off" />
            </label>
          </div>
          <div class="axis-foot">
            <button id="axis-reset" type="button" class="ghost">Reset to default</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
